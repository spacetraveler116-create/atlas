<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>

:root{
  --bg:#fafaf9;--surface:#fff;--ink:#111827;--ink-2:#4b5563;--ink-3:#9ca3af;
  --line:#e5e7eb;--line-2:#f1f1ef;--hover:#f4f4f2;--accent:#0f766e;--accent-ink:#fff;
  --accent-soft:#e6f4f1;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --r:10px;--sb:228px;
}
:root[data-theme=dark]{
  --bg:#0c0d0f;--surface:#141518;--ink:#f3f4f6;--ink-2:#a1a1aa;--ink-3:#6b7280;
  --line:#26282d;--line-2:#1c1e22;--hover:#1b1d21;--accent:#2dd4bf;--accent-ink:#06201c;--accent-soft:#12302c;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
/* sidebar */
.sb{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.logo{width:24px;height:24px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:var(--surface);font-size:12px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--hover);color:var(--ink)}
.nav a.on svg{color:var(--accent)}
.sp{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line-2);margin-top:8px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:650}
.me small{display:block;color:var(--ink-3);font-size:12px}
/* main */
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:20px 32px 0}
.top h1{font-size:22px;font-weight:650;letter-spacing:-.02em;flex:1}
.page{padding:20px 32px 48px;max-width:1320px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.ic{width:34px;padding:0;justify-content:center}
.seg{display:inline-flex;background:var(--hover);border-radius:9px;padding:3px}
.seg button{padding:4px 12px;border-radius:7px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.search{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 11px;color:var(--ink-3);min-width:240px}
.search input{border:0;outline:0;background:none;flex:1;color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.sb2{justify-content:space-between}
.pill{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink-2);font-size:13px}
.pill b{color:var(--ink);font-weight:550}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.h2{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.h2 a{color:var(--accent);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi span{display:block;color:var(--ink-3);font-size:12px;margin-bottom:6px}
.kpi strong{font-size:26px;font-weight:600;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:6px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover);cursor:pointer}
.r{text-align:right}
.mut{color:var(--ink-3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--ink-3)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--hover);color:var(--ink-2)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--line-2);border-radius:12px;padding:10px;min-height:300px}
:root[data-theme=dark] .col{background:#101114}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.colh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-weight:600}
.colh small{color:var(--ink-3);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:grab}
.kc:active{cursor:grabbing}
.kc:hover{border-color:var(--ink-3)}
.kc h4{font-size:14px;font-weight:600;margin-bottom:2px}
.kc .sub{color:var(--ink-3);font-size:12px}
.kc .v{margin-top:10px;display:flex;justify-content:space-between;font-weight:600}
.kc .v span{font-weight:400;color:var(--ink-3);font-size:12px}
/* chart */
.bars{display:flex;align-items:flex-end;gap:18px;height:170px;padding:6px 4px 0;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.9}
.bar.alt i{background:var(--ink);opacity:.15}
.bl{display:flex;gap:18px;padding:6px 4px;color:var(--ink-3);font-size:12px}
.bl span{flex:1;text-align:center}
.prog{height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
/* tabs */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{padding:10px 0;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
/* quote */
.qwrap{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:1000px){.qwrap{grid-template-columns:1fr}}
.qin{width:64px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:right;padding:0 8px}
.qin.w{width:92px}
.qin:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.sum div{display:flex;justify-content:space-between;padding:7px 0;color:var(--ink-2)}
.sum .t{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:20px;font-weight:650;color:var(--ink)}
.sum .g{color:var(--ok);font-weight:600}
.grp{padding:10px 16px;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--line-2);text-transform:uppercase;letter-spacing:.04em}
/* catalog */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.prod{padding:14px}
.ph{height:110px;border-radius:8px;background:var(--line-2);display:grid;place-items:center;color:var(--ink-3);margin-bottom:12px}
.ph svg{width:34px;height:34px;stroke-width:1.2}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:92px;padding:6px 8px;font-size:12px;color:var(--ink-3)}
.cal .hd{min-height:0;font-weight:500;background:var(--line-2)}
.cal .td{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ev{display:block;margin-top:4px;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* settings */
.sg{display:grid;grid-template-columns:200px 1fr;gap:28px}
@media(max-width:800px){.sg{grid-template-columns:1fr}}
.sg nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink-2)}
.sg nav a.on{background:var(--hover);color:var(--ink)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.fld input,.fld select{width:100%;max-width:380px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 11px;background:var(--surface)}
.chk{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.chk:last-child{border:0}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.chk.done span{text-decoration:line-through;color:var(--ink-3)}
/* drawer / palette */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;z-index:50}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);padding:24px;z-index:60;transform:translateX(100%);transition:transform .2s;overflow:auto}
.drawer.on{transform:none}
.pal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(520px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;z-index:70;display:none;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.pal.on{display:block}
.pal input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);outline:0;padding:0 18px;background:none;font-size:15px}
.pal a{display:flex;gap:10px;align-items:center;padding:11px 18px;color:var(--ink-2)}
.pal a:hover,.pal a.sel{background:var(--hover);color:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.menu{display:none}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sb{position:fixed;z-index:40;width:250px;transform:translateX(-100%);transition:.2s}
  .sb.on{transform:none}
  .menu{display:inline-flex}
  .top,.page{padding-left:18px;padding-right:18px}
}

/* --- v2 additions --- */
.bnav{display:none}
@media(max-width:820px){
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:4px 0}
  .bnav a.on{color:var(--accent)}
  .page{padding-bottom:90px}
  .top h1{font-size:19px}
  #palBtn span{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .tabs{overflow-x:auto;white-space:nowrap}
  table{font-size:13px}
  .card>table,.card{overflow-x:auto}
  th,td{padding:10px 12px}
}
.tabs.scroll{overflow-x:auto}
.hill{width:100%;height:auto;max-height:220px}.pill.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;padding:16px}
.msg{max-width:78%;padding:9px 13px;border-radius:12px;background:var(--hover)}
.msg.me{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.msg small{display:block;color:var(--ink-3);font-size:11px;margin-bottom:2px}
.post{padding:16px 18px;border-bottom:1px solid var(--line-2)}
.post:last-child{border:0}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-bottom:16px;font-weight:500}
.prop{max-width:820px;margin:0 auto}
.prop .hero{padding:36px 32px;border-bottom:1px solid var(--line)}
.prop .hero h2{font-size:28px;letter-spacing:-.03em;margin:6px 0}
.opt{display:flex;align-items:center;gap:12px;padding:14px 32px;border-bottom:1px solid var(--line-2)}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.fieldcard{padding:16px;margin-bottom:12px}
.big{width:100%;justify-content:center;height:48px;font-size:15px}
.snap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dotok{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.lnk{color:var(--accent);font-weight:500}
select.pill{padding-right:8px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-2);cursor:pointer}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
/* ===== v3 additions ===== */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tw{overflow-x:auto}.sm{font-size:12px}.nw{white-space:nowrap}.bad{color:var(--bad)}
.btn.sm0{height:28px;padding:0 10px;font-size:13px}.btn.ic.sm0{width:28px;padding:0}.btn[disabled]{opacity:.45;cursor:default}
.btn.dng{color:var(--bad)}.btn.dng:hover{background:rgba(220,38,38,.08)}
.dh{font-size:20px;letter-spacing:-.02em;font-weight:650}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}.kv span{color:var(--ink-3)}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}.li:last-child{border:0}
.empty.sm{padding:20px;font-size:12px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.step{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:10px}
.chk0{display:flex;align-items:center;gap:10px;margin:6px 0 14px}.chk0 input{width:16px;height:16px;accent-color:var(--accent)}
.fld input[type=checkbox]{width:auto}
.fld textarea{width:100%;max-width:380px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);resize:vertical;font:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.qname{width:100%;border:0;background:none;font-size:22px;font-weight:650;letter-spacing:-.02em;padding:4px 0}
.qin.t{width:100%;min-width:170px;text-align:left}
table.qt{min-width:980px}.optrow td{background:var(--accent-soft)}
.pad2{padding:22px 32px}.brandmark{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:18px}
.sigline{margin-top:28px;color:var(--ink-3);display:none}
.reply{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--hover);font-size:13px}
.ol{padding-left:20px;line-height:1.9}
.cal .day{cursor:pointer}.cal .dn{display:block;font-weight:600;margin-bottom:2px}.cal .oth{background:var(--line-2);min-height:92px}
.ev{cursor:pointer}.ev.t{background:var(--hover);color:var(--ink-2)}.ev.s{background:#fff3e0;color:#b45309}.ev.b{background:#e8f0fe;color:#1d4ed8}
.pimg{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--line-2);color:var(--ink-3);overflow:hidden;flex:none}
.pimg img{width:100%;height:100%;object-fit:contain;background:#fff}.pimg svg{width:20px;height:20px}
.pimg.sm{width:32px;height:32px}.pimg.lg{width:72px;height:72px}
.sg nav a{cursor:pointer}
@media print{
 .sb,.top,.bnav,.noprint,.ov,.drawer,.toast,.pal{display:none!important}
 .app{display:block}body{background:#fff;color:#000}.page{padding:0;max-width:none}
 .card{border:0!important;box-shadow:none}.prop{max-width:none}.sigline{display:block}
 :root{--bg:#fff;--surface:#fff;--ink:#111;--line:#ddd}
}

.prop.clean{max-width:860px;margin:0 auto;overflow:hidden}
.prop.clean .cover{padding:40px 44px 34px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:.12em;color:var(--ink-3);font-weight:600;margin:26px 0 8px}
.prop.clean h2{font-size:34px;letter-spacing:-.03em;margin:4px 0 6px;line-height:1.15}
.cover-total{margin-top:26px;display:inline-flex;flex-direction:column;padding:14px 20px;border-radius:12px;background:var(--hover)}.cover-total b{font-size:26px;letter-spacing:-.02em}
.room{padding:26px 44px 8px}.room h3{font-size:19px;letter-spacing:-.02em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pitem{display:flex;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid var(--line-2)}.pitem:last-child{border:0}
.pitem .pimg.xl{width:88px;height:88px;border-radius:12px;border:1px solid var(--line-2)}
.pi-main{flex:1;min-width:0}.pi-main b{font-weight:600;font-size:15px}.pi-q{color:var(--ink-3);min-width:44px;text-align:right}.pi-p{min-width:96px;text-align:right;font-weight:600}
.pitem.lab{padding:10px 0}.pitem.lab b{color:var(--ink-2);font-weight:500}
.opt2{cursor:pointer}.opt2 input{width:18px;height:18px;accent-color:var(--accent)}
.totals{padding:24px 44px;max-width:420px;margin-left:auto}.kv.grand{font-size:22px;border:0;padding-top:14px}.kv.grand span{color:var(--ink)}
.prop.clean .pad2{padding:22px 44px}.signbox{border-top:1px solid var(--line);background:var(--line-2)}
.pimg.xl svg{width:30px;height:30px}
@media(max-width:700px){.prop.clean .cover,.prop.clean .pad2,.room{padding-left:20px;padding-right:20px}.prop.clean h2{font-size:26px}.pitem{gap:12px}.pitem .pimg.xl{width:64px;height:64px}.pi-p{min-width:70px}}
@media print{.prop.clean{max-width:none}.pitem,.room h3{break-inside:avoid}}

.qwrap>*,.grid2>*,.grid3>*,.sg>*{min-width:0}
table.qt{min-width:820px}.qt .qin{width:56px}.qt .qin.w{width:80px}.qt .qin.t{min-width:150px;width:100%}
.qwrap{grid-template-columns:1fr 290px}
@media(max-width:1000px){.qwrap{grid-template-columns:1fr}}

.syncind{padding:4px 10px 8px;font-size:12px}.syl{display:flex;align-items:center;gap:8px;color:var(--ink-3)}.sd{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.syl.ok .sd{background:var(--ok)}.syl.syncing .sd{background:var(--info)}.syl.error .sd,.syl.conflict .sd{background:var(--bad)}.syl.offline .sd{background:var(--warn)}
.ol{margin-bottom:18px}

</style>
</head>
<body>
<div class="app">
  <aside class="sb" id="sb">
    <div class="brand"><div class="logo" id="logo">A</div><span id="brandName">Atlas</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sp"></div>
    <div id="syncInd" class="syncind"></div>
    <button class="nav" style="text-align:left" id="themeBtn" aria-label="Toggle dark mode"><a style="cursor:pointer"><span id="themeIcon"></span><span id="themeLbl">Dark mode</span></a></button>
  </aside>
  <main>
    <div class="top">
      <button class="btn ic menu" id="menuBtn" aria-label="Menu"></button>
      <h1 id="title"></h1>

const part=v=>v instanceof Safe?v.s:Array.isArray(v)?v.map(part).join(''):(v===null||v===undefined||v===false||v===true)?'':esc(v);

function migrate(){const b=blank();for(const k in b){if(DB[k]===undefined)DB[k]=b[k]}for(const k in b.settings){if(DB.settings[k]===undefined)DB.settings[k]=b.settings[k]}for(const k in b.settings.company){if(DB.settings.company[k]===undefined)DB.settings.company[k]=b.settings.company[k]}}
function loadDB(){try{const t=localStorage.getItem(KEY);if(t){DB=JSON.parse(t);migrate();return true}}catch(e){MEM=true}DB=blank();return false}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(persist,120);if(window.cloudDirty)cloudDirty()}
function persist(){try{DB.meta.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Browser storage is full or blocked. Download a backup in Settings.')}}
function nextId(p){DB.seq[p]=(DB.seq[p]||0)+1;return p+'-'+DB.seq[p]}

/* ============ pricing + quote math ============ */
const priceOf=p=>{const m=(DB.settings.catMarkup||{})[p.cat];const pct=(m===undefined||m==='')?DB.settings.markup:+m;return Math.round(p.cost*(1+pct/100)*100)/100};
const qItems=q=>q.items.filter(i=>!i.optional||i.sel);
function qCalc(q){const S=DB.settings,a=by('accounts',q.acctId),its=qItems(q);
 const prod=sum(its,i=>i.price*i.qty),hrs=sum(its,i=>i.labor*i.qty),lab=hrs*S.laborRate,adj=+q.adjust||0;
 const taxable=prod+(S.taxLabor?lab:0),tax=(a&&a.taxExempt)?0:Math.max(0,taxable+adj*(S.taxLabor?1:0))*S.taxRate/100;
 const sub=prod+lab+adj,total=sub+tax,cost=sum(its,i=>i.cost*i.qty)+hrs*S.laborCost,profit=sub-cost;
 return{prod,hrs,lab,adj,sub,tax,total,cost,profit,margin:sub?profit/sub*100:0,opt:sum(q.items.filter(i=>i.optional&&!i.sel),i=>i.price*i.qty)}}
const oppValue=o=>{const qs=DB.quotes.filter(q=>q.oppId===o.id&&q.stage!=='Declined');if(qs.length)return qCalc(qs[qs.length-1]).total;return +o.budget||0};

/* ============ files (IndexedDB) ============ */
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('atlas-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
async function fput(id,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(id){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fdel(id){try{const d=await idb();d.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function pickFile(cb,accept,multi){const f=$('#fileIn');f.accept=accept||'';f.multiple=!!multi;f.value='';f.onchange=()=>{if(f.files.length)cb(multi?[...f.files]:f.files[0])};f.click()}
async function addProjectFile(pid,file,kind){const id='f'+Date.now()+Math.random().toString(36).slice(2,6);try{await fput(id,file)}catch(e){toast('Could not store file in this browser');return}
 PM(pid).files.unshift({id,name:file.name,kind:kind||(file.type.startsWith('image/')?'Image':'File'),size:file.size,by:me(),on:todayISO()});logAct(pid,me()+' added '+file.name);save()}
window.openFile=async id=>{try{const b=await fget(id);if(!b)return toast('File not found on this device');const u=URL.createObjectURL(b);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){toast('Could not open file')}};
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

 ${ent==='catalog'&&id?photoCtl(id):''}${s.f.map(f=>fieldHTML(f,rec[f.k]))}<div class="row" style="margin-top:8px"><button class="btn p" type="submit">Save</button>${id?H`<button type="button" class="btn dng" onclick="delRec('${ent}','${id}')">${ic('trash')}Delete</button>`:''}</div></form>`)}
function saveForm(e,ent,id){e.preventDefault();const s=SCH[ent],fd=new FormData(e.target),isNew=!id;let rec=isNew?{}:by(s.coll,id);
 s.f.forEach(f=>{let v=f.t==='check'?fd.has(f.k):fd.get(f.k);if(f.t==='number')v=v===''||v===null?'':num(v);if(typeof v==='string')v=v.trim();rec[f.k]=v});
 if(isNew){Object.assign(rec,{id:nextId(s.pre),created:todayISO()});DB[s.coll].push(rec)}
 const hook=HOOKS[ent];if(hook)hook(rec,isNew);save();closeDrawer();toast(s.label+(isNew?' created':' saved'));const cb=formCb;formCb=null;if(cb)cb(rec);else go();return false}
const HOOKS={
 opps:(r,isNew)=>{if(r.stage==='Won'&&!r.wonOn)r.wonOn=todayISO();if(r.stage!=='Won')r.wonOn=null},
 projects:(r,isNew)=>{if(r.stage==='Completed'&&!r.doneOn)r.doneOn=todayISO();if(r.stage!=='Completed')r.doneOn=null;if(isNew)PM(r.id)},
 pos:(r,isNew)=>{if(isNew&&!r.date)r.date=todayISO();if(isNew&&!r.lines)r.lines=[]},
 invoices:(r)=>{if(r.status==='Paid'&&!r.paidOn)r.paidOn=todayISO();if(r.status!=='Paid')r.paidOn=null;if(r.amt==='')r.amt=0},
 time:(r)=>{r.cost=(+r.hours||0)*DB.settings.laborCost},

function delRec(ent,id){const s=SCH[ent],r=by(s.coll,id);if(!r||!confirm('Delete this '+s.label.toLowerCase()+'? This cannot be undone.'))return;

function setStage(ent,id,stage){const r=by(ent,id);if(!r||r.stage===stage)return;r.stage=stage;

/* ============ csv ============ */
function parseCSV(t){t=t.replace(/^﻿/,'');const delim=(t.split('\n')[0].match(/\t/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?'\t':(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
 const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==delim){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);if(r.some(x=>x.trim()))rows.push(r)}return rows}
const csvCell=v=>{v=v===null||v===undefined?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=(heads,rows)=>[heads.map(csvCell).join(',')].concat(rows.map(r=>r.map(csvCell).join(','))).join('\n');

 const h=rows[0].map(x=>x.toLowerCase().trim()),f=(re,skip)=>h.findIndex((x,i)=>re.test(x)&&!(skip||[]).includes(i));
 const m={sku:f(HDR.sku)};m.msrp=f(HDR.msrp);m.cost=f(HDR.cost,[m.msrp]);m.name=f(HDR.name,[m.sku]);m.brand=f(HDR.brand);m.cat=f(HDR.cat);
 PEND={rows,h,file:file.name,m};if(m.sku<0||m.cost<0||m.name<0)return mapDrawer();runImport()};rd.readAsText(file)},'.csv,.txt,.tsv,text/csv')}

function runImport(){const{rows,file,m}=PEND;let nw=0,up=0,ch=0;const idx=new Map(DB.catalog.map(p=>[p.sku.toLowerCase(),p]));
 rows.slice(1).forEach(r=>{const sku=(r[m.sku]||'').trim(),cost=num(r[m.cost]);if(!sku||!(cost>=0)||r[m.cost]==='')return;
  const o={name:m.name>=0?(r[m.name]||sku).trim():sku,cost};if(m.brand>=0&&r[m.brand])o.brand=r[m.brand].trim();if(m.cat>=0&&r[m.cat])o.cat=r[m.cat].trim();if(m.msrp>=0&&r[m.msrp])o.msrp=num(r[m.msrp]);
  const ex=idx.get(sku.toLowerCase());if(ex){if(Math.abs(ex.cost-cost)>0.004)ch++;Object.assign(ex,o);up++}else{const p=Object.assign({id:nextId('C'),sku,brand:'Snap One',cat:'General',msrp:cost*2,hrs:0},o);DB.catalog.push(p);idx.set(sku.toLowerCase(),p);nw++}});
 DB.snap={file,count:nw+up,when:new Date().toLocaleDateString(),changed:ch};save();go();toast(`${nw} new, ${up} updated, ${ch} price changes`,3500)}

V.reports=()=>{const qs=DB.quotes.filter(q=>q.stage!=='Declined'),calc=qs.map(qCalc),qt=sum(calc,c=>c.total),avgM=calc.length?sum(calc,c=>c.margin)/calc.length:0;
 const dec=DB.opps.filter(o=>['Won','Lost'].includes(o.stage)),won=DB.opps.filter(o=>o.stage==='Won'),rate=dec.length?Math.round(won.length/dec.length*100):0;
 const src={};DB.opps.forEach(o=>{const k=o.source||'Unknown';src[k]=(src[k]||0)+oppValue(o)});const srcT=sum(Object.values(src),x=>x)||1;
 const mons=Array.from({length:6},(_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});const rev=mons.map(m=>sum(DB.invoices.filter(i=>i.status==='Paid'&&(i.paidOn||'').startsWith(m)),i=>i.amt)),rmx=Math.max(...rev,1);
 const topC={};won.forEach(o=>{topC[acctName(o.acctId)]=(topC[acctName(o.acctId)]||0)+oppValue(o)});const top=Object.entries(topC).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const prof=DB.projects.map(p=>{const inv=sum(DB.invoices.filter(i=>i.projectId===p.id&&i.status!=='Not invoiced'),i=>i.amt),paid=sum(DB.invoices.filter(i=>i.projectId===p.id&&i.status==='Paid'),i=>i.amt),po=sum(DB.pos.filter(x=>x.projectId===p.id),poTotal),lab=sum(DB.time.filter(t=>t.projectId===p.id),t=>t.cost);return{p,inv,paid,cost:po+lab,profit:(+p.value||0)-po-lab}});

 <div class="grid3"><div class="card pad"><div class="h2">Revenue collected, last 6 months</div><div class="bars">${rev.map(v=>H`<div class="bar ${v?'':'alt'}"><i style="height:${Math.max(v/rmx*100,2)}%"></i></div>`)}</div><div class="bl">${mons.map(m=>H`<span>${new Date(m+'-02').toLocaleString('en-US',{month:'short'})}<br><b style="color:var(--ink)">${money(rev[mons.indexOf(m)])}</b></span>`)}</div></div>

 <div class="card" style="margin-top:16px"><div class="pad" style="padding-bottom:6px"><div class="h2" style="margin:0">Project profitability</div></div>${prof.length?table(['Project','Value','Invoiced','Paid','Costs (POs + labor)','Estimated profit'],prof.map(x=>tr([H`<b>${x.p.name}</b><div class="mut sm">${x.p.id}</div>`,money(x.p.value),money(x.inv),money(x.paid),money(x.cost),H`<b style="color:${x.profit>=0?'var(--ok)':'var(--bad)'}">${money(x.profit)}</b>`],[1,2,3,4,5],`location.hash='project/${x.p.id}'`)),[1,2,3,4,5]):empty('No projects yet.')}</div>`};

const SYNK='atlas-sync';
let SY=null;try{SY=JSON.parse(localStorage.getItem(SYNK))}catch(e){}
const syPersist=()=>{try{localStorage.setItem(SYNK,JSON.stringify(SY))}catch(e){}};
let syStatus=SY?'idle':'off',syMsg='',syBusy=false,syTimer=null,syConflict=false,syLast=SY&&SY.last||0;
const FILES={core:'atlas-data.json',cat:'atlas-catalog.json'};
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const shash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+':'+s.length};
const gh=(path,opt)=>{opt=opt||{};return fetch('https://api.github.com/repos/'+SY.owner+'/'+SY.repo+(path?'/contents/'+path:''),Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+SY.token,'X-GitHub-Api-Version':'2022-11-28',Accept:'application/vnd.github+json'},opt.headers||{})}))};
function syParts(){const c=Object.assign({},DB);delete c.catalog;delete c.cloud;c.meta=Object.assign({},DB.meta);delete c.meta.updated;delete c.meta.clock;return{core:JSON.stringify(c),cat:JSON.stringify(DB.catalog)}}

function syUI(){const e=$('#syncInd');if(!e)return;if(!SY){e.innerHTML='';return}
 const m={idle:'Sync ready',syncing:'Syncing…',ok:'Synced'+(syLast?' '+new Date(syLast).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''),error:'Sync problem',conflict:'Sync needs attention',offline:'Offline, will sync later'}[syStatus]||'';
 e.innerHTML=`<a href="#settings" onclick="ST.setTab='Sync devices'" class="syl ${syStatus}"><i class="sd"></i>${esc(m)}</a>`}
function cloudDirty(){if(!SY||syConflict)return;clearTimeout(syTimer);syTimer=setTimeout(syNow,3500)}
async function syNow(manual){if(!SY||syBusy)return;if(!navigator.onLine){syStatus='offline';syUI();return}
 syBusy=true;syStatus='syncing';syUI();syEnsure();let changed=false;
 try{changed=await syPull();if(!syConflict){await syPush();await syPhotos();syStatus='ok';syLast=SY.last=Date.now();syMsg=''}else syStatus='conflict'}
 catch(e){syStatus='error';syMsg=String(e.message||e);if(manual)toast('Sync problem: '+syMsg,5000)}
 finally{syBusy=false;syPersist();syUI();const pg=$('#page');if(changed&&!$('#drawer.on')&&!(document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)))go();else if(location.hash==='#settings'&&ST.setTab==='Sync devices'&&!$('#drawer.on'))go();if(syConflict&&!$('#drawer.on'))syConflictUI();if(manual&&syStatus==='ok')toast('Synced')}}
async function syPull(){let changed=false;const hasLocal=()=>DB.accounts.length+DB.opps.length+DB.projects.length+DB.quotes.length+DB.catalog.length>0;
 for(const k of ['core','cat']){const st=SY.st[k],h={};if(st.etag)h['If-None-Match']=st.etag;
  const r=await gh(FILES[k],{headers:h,cache:'no-store'});if(r.status===304)continue;if(r.status===404)continue;if(r.status===401||r.status===403)throw new Error('GitHub rejected the token. Check it has Contents read and write access to the repository.');if(!r.ok)throw new Error('GitHub error '+r.status);
  const j=await r.json();if(j.sha===st.sha){st.etag=r.headers.get('etag');continue}
  let txt;if(j.content&&j.encoding==='base64')txt=b64d(j.content);else{const rr=await gh(FILES[k],{headers:{Accept:'application/vnd.github.raw+json'}});if(!rr.ok)throw new Error('Could not read '+FILES[k]);txt=await rr.text()}
  const cur=syParts()[k],localChanged=st.sha?shash(cur)!==st.hash:(k==='core'?hasLocal():DB.catalog.length>0);
  if(localChanged&&!SY.forceCloud){syConflict=true;SY.pending={k,sha:j.sha};syPersist();continue}
  if(k==='core'){const d=JSON.parse(txt),clk=DB.meta.clock;d.catalog=DB.catalog;DB=d;migrate();DB.meta.clock=clk}else DB.catalog=JSON.parse(txt);
  persist();SY.st[k]={sha:j.sha,hash:shash(syParts()[k]),etag:r.headers.get('etag')};changed=true}
 SY.forceCloud=false;if(changed)await syPullPhotos();return changed}
async function syPush(){const p=syParts();for(const k of ['core','cat']){const st=SY.st[k],hs=shash(p[k]);if(st.hash===hs&&st.sha)continue;
  if(k==='cat'&&!DB.catalog.length&&!st.sha)continue;
  const body={message:'Atlas sync',content:b64e(p[k])};if(st.sha)body.sha=st.sha;
  const r=await gh(FILES[k],{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422){syConflict=true;await syFindRemoteSha(k);syPersist();return}
  if(r.status===401||r.status===403||r.status===404)throw new Error(r.status===404?'Repository not found. Check the owner and repository name.':'GitHub rejected the token. It needs Contents read and write access.');
  if(!r.ok)throw new Error('GitHub error '+r.status);const j=await r.json();SY.st[k]={sha:j.content.sha,hash:hs,etag:null}}}
async function syFindRemoteSha(k){const r=await gh(FILES[k],{cache:'no-store'});if(r.ok){const j=await r.json();SY.pending={k,sha:j.sha}}}
async function syPhotos(){for(const c of DB.catalog){if(!c.img||SY.photos[c.img])continue;let b;try{b=await fget(c.img)}catch(e){}if(!b)continue;
  const data=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]);f.readAsDataURL(b)});
  const r=await gh('photos/'+c.img+'.jpg',{method:'PUT',body:JSON.stringify({message:'photo',content:data})});if(r.ok||r.status===422)SY.photos[c.img]=1}}
async function syPullPhotos(){for(const c of DB.catalog){if(!c.img)continue;let have=null;try{have=await fget(c.img)}catch(e){}if(have){SY.photos[c.img]=1;continue}
  const r=await gh('photos/'+c.img+'.jpg',{headers:{Accept:'application/vnd.github.raw+json'}});if(r.ok){try{await fput(c.img,await r.blob());SY.photos[c.img]=1}catch(e){}}}}
function syConflictUI(){openDrawer(H`<div class="row sb2" style="margin-bottom:14px"><b style="font-size:17px">Two versions found</b><button class="btn ic" onclick="closeDrawer()" aria-label="Close">${ic('x')}</button></div><p class="mut" style="margin-bottom:16px">This device and the cloud copy both have changes. Pick which one to keep. Nothing is lost until you choose, so download a backup first if you are unsure.</p><div class="row" style="flex-direction:column;align-items:stretch;gap:10px">${btn('Keep the cloud copy (replace this device)','syResolve(\'cloud\')','p','cloud')}${btn('Keep this device (replace the cloud copy)','syResolve(\'device\')','','up')}${btn('Download a backup first','backup()','','dl')}</div>`)}

 else{for(const k of ['core','cat']){const r=await gh(FILES[k],{cache:'no-store'}).catch(()=>null);if(r&&r.ok){const j=await r.json();SY.st[k]={sha:j.sha,hash:'',etag:null}}else SY.st[k]={}}}

function syncPanel(){

/* ============ quick create + search ============ */
const NEWMAP={opportunities:'opps',projects:'projects',accounts:'accounts',todos:'todos',catalog:'catalog',inventory:'stock',procurement:'pos',billing:'invoices',time:'time',service:'calls',calendar:'events',field:'time'};
function quickNew(){const r=(location.hash.slice(1)||'dashboard').split('/')[0];if(NEWMAP[r])return openForm(NEWMAP[r],null,r==='time'||r==='field'?{date:todayISO(),who:me()}:null);
 openDrawer(H`<div class="row sb2" style="margin-bottom:14px"><b style="font-size:17px">Create new</b><button class="btn ic" onclick="closeDrawer()" aria-label="Close">${ic('x')}</button></div>${[['Account','accounts'],['Opportunity','opps'],['Project','projects'],['To do','todos'],['Time entry','time'],['Event','events'],['Service call','calls']].map(([l,e])=>H`<div class="li" style="cursor:pointer" data-e="${e}" onclick="openForm(this.dataset.e)"><span>${l}</span>${ic('chev')}</div>`)}<div class="li" style="cursor:pointer" onclick="newQuoteForm()"><span>Quote</span>${ic('chev')}</div>`)}
let palSel=0,palItems=[];
function palBuild(){const q=$('#palIn').value.toLowerCase().trim();let l=routes.filter(r=>r[1].toLowerCase().includes(q)).map(r=>({t:r[1],s:'Go to',h:'#'+r[0],i:r[2]}));
 if(q.length>1){const add=(arr,fn)=>arr.filter(x=>fn(x).t.toLowerCase().includes(q)||(fn(x).s||'').toLowerCase().includes(q)).slice(0,5).forEach(x=>l.push(fn(x)));
  add(DB.accounts,a=>({t:a.name,s:'Account · '+a.id,h:'#accounts',act:`openAccount('${a.id}')`,i:'acc'}));add(DB.opps,o=>({t:o.name,s:'Opportunity · '+o.id,h:'#opportunities',act:`openOpp('${o.id}')`,i:'opp'}));add(DB.projects,p=>({t:p.name,s:'Project · '+p.id,h:'#project/'+p.id,i:'proj'}));add(DB.quotes,x=>({t:x.name,s:'Quote · '+x.id,h:'#quote/'+x.id,i:'file'}));add(DB.catalog,p=>({t:p.name,s:'Product · '+p.sku,h:'#catalog',i:'box'}))}
 palItems=l;palSel=0;palDraw()}
function palDraw(){$('#palList').innerHTML=palItems.length?palItems.map((x,i)=>`<a href="${esc(x.h)}" class="${i===palSel?'sel':''}" data-i="${i}">${ic(x.i||'search').s}<span style="flex:1">${esc(x.t)}</span><small class="mut">${esc(x.s)}</small></a>`).join(''):'<div class="empty">No results</div>'}
function palGo(i){const x=palItems[i];if(!x)return;closeDrawer();if(x.act){location.hash=x.h.slice(1);setTimeout(()=>new Function(x.act)(),30)}else location.hash=x.h.slice(1)}
function openPal(){$('#pal').classList.add('on');$('#ov').classList.add('on');$('#palIn').value='';palBuild();$('#palIn').focus()}

/* ============ theme ============ */
function theme(t){document.documentElement.dataset.theme=t;$('#themeIcon').innerHTML=ic(t==='dark'?'sun':'moon').s;$('#themeLbl').textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('atlas-theme',t)}catch(e){}}

/* ============ boot ============ */
function brand(){const c=co();$('#logo').textContent=(c.logoText||'A').slice(0,2);$('#brandName').textContent=c.name||'Atlas'}
const _go=go;go=function(){_go();brand();hydrateImgs()};
(function boot(){
 loadDB();
 $('#nav').innerHTML=routes.map(r=>`<a href="#${r[0]}" data-r="${r[0]}">${ic(r[2]).s}${r[1]}</a>`).join('');
 $('#menuBtn').innerHTML=ic('menu').s;$('#menuBtn').onclick=()=>$('#sb').classList.toggle('on');
 $('#ov').onclick=closeDrawer;$('#newBtn').onclick=quickNew;$('#palBtn').onclick=openPal;
 $('#palIn').oninput=palBuild;
 $('#palIn').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);palDraw()}else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);palDraw()}else if(e.key==='Enter')palGo(palSel)};
 $('#palList').onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();palGo(+a.dataset.i)}};
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}if(e.key==='Escape')closeDrawer()});
 $('#themeBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
 let th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';try{th=localStorage.getItem('atlas-theme')||th}catch(e){}theme(th);
 window.addEventListener('hashchange',()=>{closeDrawer();go();window.scrollTo(0,0)});
 window.addEventListener('beforeunload',()=>{clearTimeout(saveT);persist()});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);persist()}});
 if(MEM)setTimeout(()=>toast('This browser is blocking storage. Your changes will not be kept after you close the tab.',6000),500);
 go();syInit();
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — Integrator Workspace</title>
<style>
:root{
  --bg:#fafaf9;--surface:#fff;--ink:#111827;--ink-2:#4b5563;--ink-3:#9ca3af;
  --line:#e5e7eb;--line-2:#f1f1ef;--hover:#f4f4f2;--accent:#0f766e;--accent-ink:#fff;
  --accent-soft:#e6f4f1;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --r:10px;--sb:228px;
}
:root[data-theme=dark]{
  --bg:#0c0d0f;--surface:#141518;--ink:#f3f4f6;--ink-2:#a1a1aa;--ink-3:#6b7280;
  --line:#26282d;--line-2:#1c1e22;--hover:#1b1d21;--accent:#2dd4bf;--accent-ink:#06201c;--accent-soft:#12302c;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
/* sidebar */
.sb{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.logo{width:24px;height:24px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:var(--surface);font-size:12px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--hover);color:var(--ink)}
.nav a.on svg{color:var(--accent)}
.sp{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line-2);margin-top:8px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:650}
.me small{display:block;color:var(--ink-3);font-size:12px}
/* main */
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:20px 32px 0}
.top h1{font-size:22px;font-weight:650;letter-spacing:-.02em;flex:1}
.page{padding:20px 32px 48px;max-width:1320px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.ic{width:34px;padding:0;justify-content:center}
.seg{display:inline-flex;background:var(--hover);border-radius:9px;padding:3px}
.seg button{padding:4px 12px;border-radius:7px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.search{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 11px;color:var(--ink-3);min-width:240px}
.search input{border:0;outline:0;background:none;flex:1;color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.sb2{justify-content:space-between}
.pill{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink-2);font-size:13px}
.pill b{color:var(--ink);font-weight:550}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.h2{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.h2 a{color:var(--accent);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi span{display:block;color:var(--ink-3);font-size:12px;margin-bottom:6px}
.kpi strong{font-size:26px;font-weight:600;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:6px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover);cursor:pointer}
.r{text-align:right}
.mut{color:var(--ink-3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--ink-3)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--hover);color:var(--ink-2)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--line-2);border-radius:12px;padding:10px;min-height:300px}
:root[data-theme=dark] .col{background:#101114}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.colh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-weight:600}
.colh small{color:var(--ink-3);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:grab}
.kc:active{cursor:grabbing}
.kc:hover{border-color:var(--ink-3)}
.kc h4{font-size:14px;font-weight:600;margin-bottom:2px}
.kc .sub{color:var(--ink-3);font-size:12px}
.kc .v{margin-top:10px;display:flex;justify-content:space-between;font-weight:600}
.kc .v span{font-weight:400;color:var(--ink-3);font-size:12px}
/* chart */
.bars{display:flex;align-items:flex-end;gap:18px;height:170px;padding:6px 4px 0;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.9}
.bar.alt i{background:var(--ink);opacity:.15}
.bl{display:flex;gap:18px;padding:6px 4px;color:var(--ink-3);font-size:12px}
.bl span{flex:1;text-align:center}
.prog{height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
/* tabs */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{padding:10px 0;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
/* quote */
.qwrap{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:1000px){.qwrap{grid-template-columns:1fr}}
.qin{width:64px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:right;padding:0 8px}
.qin.w{width:92px}
.qin:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.sum div{display:flex;justify-content:space-between;padding:7px 0;color:var(--ink-2)}
.sum .t{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:20px;font-weight:650;color:var(--ink)}
.sum .g{color:var(--ok);font-weight:600}
.grp{padding:10px 16px;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--line-2);text-transform:uppercase;letter-spacing:.04em}
/* catalog */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.prod{padding:14px}
.ph{height:110px;border-radius:8px;background:var(--line-2);display:grid;place-items:center;color:var(--ink-3);margin-bottom:12px}
.ph svg{width:34px;height:34px;stroke-width:1.2}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:92px;padding:6px 8px;font-size:12px;color:var(--ink-3)}
.cal .hd{min-height:0;font-weight:500;background:var(--line-2)}
.cal .td{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ev{display:block;margin-top:4px;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* settings */
.sg{display:grid;grid-template-columns:200px 1fr;gap:28px}
@media(max-width:800px){.sg{grid-template-columns:1fr}}
.sg nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink-2)}
.sg nav a.on{background:var(--hover);color:var(--ink)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.fld input,.fld select{width:100%;max-width:380px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 11px;background:var(--surface)}
.chk{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.chk:last-child{border:0}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.chk.done span{text-decoration:line-through;color:var(--ink-3)}
/* drawer / palette */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;z-index:50}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);padding:24px;z-index:60;transform:translateX(100%);transition:transform .2s;overflow:auto}
.drawer.on{transform:none}
.pal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(520px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;z-index:70;display:none;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.pal.on{display:block}
.pal input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);outline:0;padding:0 18px;background:none;font-size:15px}
.pal a{display:flex;gap:10px;align-items:center;padding:11px 18px;color:var(--ink-2)}
.pal a:hover,.pal a.sel{background:var(--hover);color:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.menu{display:none}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sb{position:fixed;z-index:40;width:250px;transform:translateX(-100%);transition:.2s}
  .sb.on{transform:none}
  .menu{display:inline-flex}
  .top,.page{padding-left:18px;padding-right:18px}
}

/* --- v2 additions --- */
.bnav{display:none}
@media(max-width:820px){
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:4px 0}
  .bnav a.on{color:var(--accent)}
  .page{padding-bottom:90px}
  .top h1{font-size:19px}
  #palBtn span{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .tabs{overflow-x:auto;white-space:nowrap}
  table{font-size:13px}
  .card>table,.card{overflow-x:auto}
  th,td{padding:10px 12px}
}
.tabs.scroll{overflow-x:auto}
.hill{width:100%;height:auto;max-height:220px}.pill.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;padding:16px}
.msg{max-width:78%;padding:9px 13px;border-radius:12px;background:var(--hover)}
.msg.me{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.msg small{display:block;color:var(--ink-3);font-size:11px;margin-bottom:2px}
.post{padding:16px 18px;border-bottom:1px solid var(--line-2)}
.post:last-child{border:0}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-bottom:16px;font-weight:500}
.prop{max-width:820px;margin:0 auto}
.prop .hero{padding:36px 32px;border-bottom:1px solid var(--line)}
.prop .hero h2{font-size:28px;letter-spacing:-.03em;margin:6px 0}
.opt{display:flex;align-items:center;gap:12px;padding:14px 32px;border-bottom:1px solid var(--line-2)}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.fieldcard{padding:16px;margin-bottom:12px}
.big{width:100%;justify-content:center;height:48px;font-size:15px}
.snap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dotok{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.lnk{color:var(--accent);font-weight:500}
select.pill{padding-right:8px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-2);cursor:pointer}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<div class="app">
  <aside class="sb" id="sb">
    <div class="brand"><div class="logo">A</div>Atlas</div>
    <nav class="nav" id="nav"></nav>
    <div class="sp"></div>
    <button class="nav" style="text-align:left" id="themeBtn"><a style="cursor:pointer"><span id="themeIcon"></span><span id="themeLbl">Dark mode</span></a></button>
    <div class="me"><div class="av">AG</div><div>Armando<small>Administrator</small></div></div>
  </aside>
  <main>
    <div class="top">
      <button class="btn ic menu" id="menuBtn" aria-label="Menu"></button>
      <h1 id="title"></h1>
      <button class="btn" id="palBtn">Search <span class="mut">Ctrl K</span></button>
      <button class="btn p" id="newBtn">+ New</button>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>
<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<div class="pal" id="pal"><input id="palIn" placeholder="Jump to…"><div id="palList"></div></div>
<div class="toast" id="toast"></div>
<nav class="bnav" id="bnav"></nav>
<input type="file" id="fileIn" hidden>

<script>

const P={

const ic=(n)=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s);
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const money2=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- sample data (fictional) ---------- */
const seed={

  {id:'O-31',name:'Lakeview Theater Room',acct:'Harper Residence',stage:'New',val:48200},
  {id:'O-32',name:'Whole-Home Wi-Fi Upgrade',acct:'Delgado Home',stage:'New',val:6400},

$('#newBtn').onclick=()=>{
 const r=(location.hash.slice(1)||'dashboard').split('/')[0];
 if(r==='opportunities'||r==='dashboard'){S.opps.unshift({id:'O-'+(35+S.opps.length),name:'New opportunity',acct:'Unassigned',stage:'New',val:0});save();location.hash='opportunities';go();toast('Opportunity created')}
 else if(r==='todos'){const n=$('#nt');n&&n.focus()}
 else toast('Creating records is wired up in the next build step');
};
/* command palette */
const pal=$('#pal'),palIn=$('#palIn');
function palRender(){const q=palIn.value.toLowerCase();$('#palList').innerHTML=routes.filter(r=>r[1].toLowerCase().includes(q)).map((r,i)=>`<a href="#${r[0]}" class="${i?'':'sel'}" onclick="closeDrawer()">${ic(r[2])}${r[1]}</a>`).join('')}
function openPal(){pal.classList.add('on');$('#ov').classList.add('on');palIn.value='';palRender();palIn.focus()}
$('#palBtn').onclick=openPal;palIn.oninput=palRender;
palIn.onkeydown=e=>{if(e.key==='Enter'){const a=$('#palList a');if(a){location.hash=a.getAttribute('href');closeDrawer()}}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}if(e.key==='Escape')closeDrawer()});
/* theme */
function theme(t){document.documentElement.dataset.theme=t;$('#themeIcon').innerHTML=ic(t==='dark'?'sun':'moon');$('#themeLbl').textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('atlas-theme',t)}catch(e){}}
$('#themeBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
let th='light';try{th=localStorage.getItem('atlas-theme')||th}catch(e){}
theme(th);
window.addEventListener('hashchange',go);go();
</script>
</body>
</html>
